name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect the packages without publishing them
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm release:pack
      - name: Inspect package publication
        if: inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tarball in release-artifacts/*.tgz; do
            npm publish "./$tarball" --access public --tag beta --ignore-scripts --dry-run
          done
      - name: Upload release artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: release-artifacts
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-artifacts
      - name: Verify release artifacts
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s SHA256SUMS ]]; then
            sha256sum --check SHA256SUMS
          else
            echo "No unpublished package artifacts to verify."
          fi
      - name: Publish beta packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tarball in release-artifacts/*.tgz; do
            npm publish "./$tarball" --access public --tag beta --ignore-scripts --provenance
          done

  tag:
    needs: publish
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: release-artifacts
      - name: Create package tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          jq -r '.packages[] | "\(.name)@\(.version)"' release-artifacts/release-manifest.json |
            while IFS= read -r tag; do
              if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
                continue
              fi
              git tag --annotate "$tag" --message "$tag"
            done
      - name: Push package tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --follow-tags
      - name: Create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.packages[] | [.name, .version, .directory] | @tsv' release-artifacts/release-manifest.json |
            while IFS=$'\t' read -r name version directory; do
              tag="${name}@${version}"
              if gh release view "$tag" >/dev/null 2>&1; then
                continue
              fi
              awk -v heading="## ${version}" '
                $0 == heading { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' "${directory}/CHANGELOG.md" > release-notes.md
              prerelease=()
              if [[ "$version" == *-* ]]; then
                prerelease=(--prerelease)
              fi
              gh release create "$tag" --verify-tag --title "$tag" \
                --notes-file release-notes.md "${prerelease[@]}"
            done
