name: Sync OpenAPI

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

concurrency:
  group: openapi-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:update
      - run: pnpm openapi:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.release-app.outputs.token }}
          branch: automation/openapi-sync
          base: main
          add-paths: |
            packages/agent-sdk/openapi/agent-v1.json
            packages/agent-sdk/src/internal/generated/agent-v1.ts
            scripts/openapi-checksums.json
          commit-message: "chore: sync Agent OpenAPI contract"
          sign-commits: true
          title: Sync Agent OpenAPI contract
          body: Generated from the live Bounty Agent API. Review the contract and generated TypeScript declarations together.
